<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>OG Cover — Vinatrans Tổng kết 2026 · Cao cấp</title>
<!-- Trang dựng ảnh chia sẻ (og-cover) 1200×630. KHÔNG phải trang cho khách xem — chỉ dùng để chụp ra og-cover.jpg.
  Chụp lại khi đổi nội dung:
    node scripts/build-og-cover.js --page products/Invitation/Other/gen_360_vinatrans-tong-ket-2026-cao-cap/og-cover.html --out products/Invitation/Other/gen_360_vinatrans-tong-ket-2026-cao-cap/og-cover.jpg -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .cover { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(135deg, #0a1230 0%, #101c4e 60%, #0a1230 100%);
    color: #f4efe0; text-align: center; font-family: 'Be Vietnam Pro', sans-serif; }
  .cover::before { content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 15% 20%, rgba(212,175,55,.5) 0 3px, transparent 4px),
      radial-gradient(circle at 85% 15%, rgba(212,175,55,.4) 0 2px, transparent 3px),
      radial-gradient(circle at 75% 85%, rgba(212,175,55,.45) 0 3px, transparent 4px),
      radial-gradient(circle at 25% 80%, rgba(212,175,55,.35) 0 2px, transparent 3px),
      radial-gradient(circle at 50% 50%, rgba(212,175,55,.12) 0 2px, transparent 3px);
    background-size: 420px 300px; }
  .frame { position: absolute; inset: 24px; border: 2px solid rgba(212,175,55,.9); border-radius: 8px; z-index: 3; }
  .frame::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(212,175,55,.45); border-radius: 5px; }
  .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 90px; }
  .logo { height: 74px; filter: brightness(0) invert(1); }
  .co { font-size: 20px; font-weight: 600; letter-spacing: .14em; margin-top: 24px; color: #d8dcf0; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 96px; line-height: 1.05; margin-top: 10px;
    background: linear-gradient(180deg, #f7e7a1 0%, #d4af37 55%, #f2d98c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 26px; color: #f4efe0; margin-top: 10px; letter-spacing: .04em; }
  .rule { display: flex; align-items: center; gap: 14px; margin: 22px 0 18px; color: #d4af37; }
  .rule::before, .rule::after { content: ''; width: 180px; height: 2px; background: #d4af37; }
  .rule span { font-size: 20px; }
  .when { font-size: 27px; font-weight: 700; letter-spacing: .04em; color: #f2d98c; }
  .where { font-size: 22px; color: #c9cfe8; margin-top: 8px; }
</style>
</head>
<body>
<div class="cover">
  <div class="frame"></div>
  <div class="inner">
    <img class="logo" src="images/logo.png" alt="VINATRANS">
    <p class="co">CÔNG TY CỔ PHẦN GIAO NHẬN KHO VẬN NGOẠI THƯƠNG VIỆT NAM</p>
    <h1>HỘI NGHỊ</h1>
    <p class="sub">TỔNG KẾT CÔNG TÁC NĂM 2026 VÀ HỘI NGHỊ NGƯỜI LAO ĐỘNG CÔNG TY VINATRANS</p>
    <div class="rule"><span>◆</span></div>
    <p class="when">Thứ Ba · 22.12.2026 · 09:00</p>
    <p class="where">Hội trường Lầu 6, 56 Thủ Khoa Huân, P. Bến Thành, TP.HCM</p>
  </div>
</div>
</body>
</html>

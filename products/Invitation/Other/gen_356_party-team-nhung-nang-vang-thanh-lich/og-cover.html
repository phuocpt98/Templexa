<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 1200px; height: 630px; overflow: hidden; }

    .cover {
        position: relative;
        width: 1200px; height: 630px;
        background: linear-gradient(135deg, #fffbeF 0%, #fdf6e3 45%, #fbeecb 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        overflow: hidden;
    }

    /* Tia nắng từ góc phải trên */
    .rays {
        position: absolute; right: -140px; top: -140px; width: 520px; height: 520px;
        background: radial-gradient(circle, rgba(246,196,83,.55) 0%, rgba(246,196,83,.18) 45%, transparent 68%);
    }
    .rays2 {
        position: absolute; left: -160px; bottom: -180px; width: 460px; height: 460px;
        background: radial-gradient(circle, rgba(14,124,123,.16) 0%, transparent 65%);
    }

    /* Mặt trời trang trí góc phải */
    .sun { position: absolute; right: 84px; top: 64px; width: 150px; height: 150px; }
    .sun svg { width: 100%; height: 100%; }

    /* Khung viền mảnh */
    .frame { position: absolute; inset: 26px; border: 2px solid rgba(196,127,14,.5); border-radius: 6px; }
    .frame::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(14,124,123,.35); border-radius: 3px; }

    .inner {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center;
        text-align: center; padding: 0 120px;
    }

    .eyebrow {
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 17px; font-weight: 600;
        letter-spacing: 0.44em; text-indent: 0.44em;
        color: #0a5e5d;
        margin-bottom: 18px;
    }

    .title {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: 92px; line-height: 1.04;
        color: #4a3226;
    }
    .title em {
        font-style: italic; font-weight: 600;
        color: #c47f0e;
    }

    .subtitle {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-size: 30px; font-weight: 500;
        color: #0a5e5d;
        margin-top: 12px;
    }

    .divider { display: flex; align-items: center; gap: 14px; margin: 20px 0 18px; }
    .divider::before, .divider::after { content: ''; width: 120px; height: 1px; background: #c47f0e; opacity: .6; }
    .divider span { width: 12px; height: 12px; border-radius: 50%; background: #f6c453; border: 2px solid #c47f0e; }

    .date {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: 40px;
        letter-spacing: 0.12em;
        color: #4a3226;
        font-variant-numeric: lining-nums;
    }

    .venue {
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 19px; font-weight: 500;
        letter-spacing: 0.1em;
        color: #6b5138;
        margin-top: 12px;
    }
</style>

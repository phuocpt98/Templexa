<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ hồi âm của Rio</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fraunces:opsz,wght@9..144,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2C5873;--ink-2:#4F7A92;--coral:#C4644F;--sky:#BFE3F5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Quicksand',system-ui,sans-serif;font-weight:500;font-size:17px;line-height:1.55;color:var(--ink);background:#FFF8EA url('images/paper.webp')}
.wrap{max-width:720px;margin:0 auto;padding:30px 16px 48px}
h1{font-family:'Fraunces',Georgia,serif;font-size:1.75rem;line-height:1.2;text-align:center}
.phu{text-align:center;color:var(--ink-2);margin-top:4px}
.tong{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 16px}
.o{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:0 6px 18px rgba(44,88,115,.1)}
.o b{display:block;font-family:'Fraunces',Georgia,serif;font-size:1.9rem;line-height:1.15}
.o span{font-size:.94rem;color:var(--ink-2)}
.nut-hang{display:flex;gap:10px;margin-bottom:22px}
button{flex:1;font:700 1rem 'Quicksand',sans-serif;min-height:46px;border:0;border-radius:99px;background:#58ABC9;color:#fff;cursor:pointer}
button.phu-nut{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(95,180,207,.7)}
.the{display:flex;gap:12px;background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(44,88,115,.1)}
.the img{flex:0 0 44px;width:44px;height:44px;object-fit:contain}
.the strong{display:block;font-family:'Fraunces',Georgia,serif;font-size:1.08rem;overflow-wrap:anywhere}
.the p{color:var(--ink-2);font-size:1rem}
.the .chuc{font-family:'Dancing Script',cursive;font-size:1.32rem;line-height:1.25;color:var(--coral);margin-top:4px;overflow-wrap:anywhere}
.the small{display:block;color:var(--ink-2);font-size:.88rem;margin-top:4px}
.bao{text-align:center;color:var(--ink-2);padding:24px 0}
@media print{.nut-hang{display:none}.the,.o{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sổ hồi âm của Rio</h1>
  <p class="phu">Lời chúc và số khách gửi từ thiệp thôi nôi, 20/11/2026</p>
  <div class="tong">
    <div class="o"><b id="nl">0</b><span>người lớn</span></div>
    <div class="o"><b id="te">0</b><span>trẻ em</span></div>
    <div class="o"><b id="gd">0</b><span>nhà sẽ đến</span></div>
  </div>
  <div class="nut-hang">
    <button id="tai" type="button">Tải file Excel (CSV)</button>
    <button id="in" class="phu-nut" type="button">In / lưu PDF</button>
  </div>
  <div id="ds"><p class="bao">Đang tải hồi âm…</p></div>
</div>
<script src="../../../shared/wedding/wishes-api.js"></script>
<script>
(function () {
  'use strict';
  var SHEET = 'khach_43';
  var ANH = { 'Mây': 'images/icon-cloud.webp', 'Thuyền': 'images/boat.webp', 'Chiếc xe': 'images/car.webp' };
  var dsHienTai = [];
  function $(id) { return document.getElementById(id); }
  function moi(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  /* Cùng mã hồi âm (cột H) = khách đã sửa → chỉ giữ bản mới nhất */
  function gop(rows) {
    var theoMa = {}, thuTu = [];
    rows.forEach(function (r, i) {
      if (String(r.A || '').indexOf('TEST') === 0) return;
      var ma = r.H || ('dong-' + i);
      if (!theoMa[ma]) thuTu.push(ma);
      theoMa[ma] = r;
    });
    return thuTu.map(function (m) { return theoMa[m]; }).reverse();
  }
  function ve(rows) {
    dsHienTai = rows;
    var nl = 0, te = 0, gd = 0, ds = $('ds');
    ds.textContent = '';
    rows.forEach(function (r) {
      var den = r.B === 'Sẽ đến';
      if (den) { nl += Number(r.C) || 0; te += Number(r.D) || 0; gd++; }
      var the = moi('div', 'the');
      var anh = moi('img'); anh.src = ANH[r.F] || ANH['Mây']; anh.alt = ''; the.appendChild(anh);
      var nd = moi('div');
      nd.appendChild(moi('strong', '', r.A));
      nd.appendChild(moi('p', '', den ? 'Sẽ đến: ' + (Number(r.C) || 0) + ' người lớn, ' + (Number(r.D) || 0) + ' trẻ em' : 'Chưa thể tham dự'));
      if (r.E) nd.appendChild(moi('p', 'chuc', '“' + r.E + '”'));
      nd.appendChild(moi('small', '', (r.G || '') + (r.I && r.I !== 'Gửi lần đầu' ? ' · ' + r.I : '')));
      the.appendChild(nd);
      ds.appendChild(the);
    });
    if (!rows.length) ds.appendChild(moi('p', 'bao', 'Chưa có hồi âm nào.'));
    $('nl').textContent = nl; $('te').textContent = te; $('gd').textContent = gd;
  }
  sheetsAPI.get(SHEET).then(function (rows) { ve(gop(rows)); }).catch(function () {
    var ds = $('ds'); ds.textContent = '';
    ds.appendChild(moi('p', 'bao', 'Chưa tải được hồi âm. Bạn tải lại trang giúp nhé.'));
  });

  $('tai').addEventListener('click', function () {
    var dong = [['Tên', 'Tham dự', 'Người lớn', 'Trẻ em', 'Lời chúc', 'Biểu tượng', 'Thời gian']];
    dsHienTai.forEach(function (r) { dong.push([r.A, r.B, r.C, r.D, r.E, r.F, r.G]); });
    /* Thêm ' trước ký tự công thức để Excel không chạy nội dung khách nhập */
    function o(v) { var s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
    var csv = '﻿' + dong.map(function (d) { return d.map(o).join(','); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'hoi-am-thoi-noi-rio.csv';
    document.body.appendChild(a); a.click(); a.remove();
  });
  $('in').addEventListener('click', function () { window.print(); });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>OG Cover — Vinatrans Tổng kết 2026 · Hiện đại</title>
<!-- Trang dựng ảnh chia sẻ (og-cover) 1200×630. KHÔNG phải trang cho khách xem — chỉ dùng để chụp ra og-cover.jpg.
  Chụp lại khi đổi nội dung:
    node scripts/build-og-cover.js --page products/Invitation/Other/gen_359_vinatrans-tong-ket-2026-hien-dai/og-cover.html --out products/Invitation/Other/gen_359_vinatrans-tong-ket-2026-hien-dai/og-cover.jpg -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .cover { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: #f7f3e8; color: #1b2a5e; font-family: 'Be Vietnam Pro', sans-serif; display: flex; }
  .band { flex: 0 0 92px; background: #b3202c; display: flex; align-items: center; justify-content: center; }
  .band span { writing-mode: vertical-rl; color: #fff; font-family: 'Playfair Display', serif; font-weight: 800; font-size: 44px; letter-spacing: .3em; }
  .frame { position: absolute; inset: 22px 22px 22px 114px; border: 2px solid rgba(179,32,44,.55); border-radius: 6px; z-index: 3; pointer-events: none; }
  .inner { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 40px 70px 40px 80px; }
  .logo { height: 78px; }
  .co { font-size: 20px; font-weight: 600; letter-spacing: .1em; margin-top: 24px; color: #3c4a7d; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 76px; line-height: 1.08; margin-top: 12px; }
  h1 em { font-style: normal; color: #b3202c; }
  .rule { width: 120px; height: 4px; background: #b3202c; margin: 24px 0 18px; }
  .when { font-size: 28px; font-weight: 800; letter-spacing: .03em; }
  .where { font-size: 22px; color: #4a5680; margin-top: 8px; }
</style>
</head>
<body>
<div class="cover">
  <div class="band"><span>THIỆP MỜI</span></div>
  <div class="frame"></div>
  <div class="inner">
    <img class="logo" src="images/logo.png" alt="VINATRANS">
    <p class="co">CÔNG TY CỔ PHẦN GIAO NHẬN KHO VẬN NGOẠI THƯƠNG VIỆT NAM</p>
    <h1>HỘI NGHỊ<br><em>TỔNG KẾT 2026</em></h1>
    <div class="rule"></div>
    <p class="when">Thứ Sáu · 25.12.2026 · 09:00</p>
    <p class="where">Hội trường Lầu 6, 56 Thủ Khoa Huân, P. Bến Thành, TP.HCM</p>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>OG Cover — Nguyễn Thông trong tôi</title>
<!--
  Trang dựng ảnh chia sẻ (og-cover) 1200×630 cho thiệp họp lớp 40 năm THPT Nguyễn Thông.
  KHÔNG phải trang cho khách xem — chỉ để chụp ra og-cover.jpg.
  Bố cục bám theo bìa "Sổ Liên Lạc" của thiệp: nền bìa nâu, nhãn sổ, ảnh xưa & nay.

  Chụp lại khi đổi nội dung:
    cd Templexa && node scripts/build-og-cover.js --page products/Invitation/Other/nguyen-thong-trong-toi/og-cover.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background-color: #8B6640;
    background-image:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.035) 0 2px, transparent 2px 10px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.025) 0 2px, transparent 2px 10px);
    box-shadow: inset 0 0 120px rgba(0,0,0,0.35);
    font-family: 'Nunito', sans-serif;
  }
  .spine {
    position: absolute; left: 0; top: 0; bottom: 0; width: 42px;
    background: linear-gradient(180deg, #5A3E1B, #8B6640 20%, #6B4C2A 50%, #8B6640 80%, #5A3E1B);
    box-shadow: inset -5px 0 10px rgba(0,0,0,0.25);
  }
  .spine::after {
    content: ''; position: absolute; left: 12px; top: 0; bottom: 0; width: 18px;
    background-image: repeating-linear-gradient(180deg, transparent 0 30px, rgba(0,0,0,0.42) 30px 44px);
  }
  .frame { position: absolute; inset: 28px 28px 28px 66px; border: 3px solid rgba(255,215,150,0.4); border-radius: 4px; }
  .frame::after { content: ''; position: absolute; inset: 7px; border: 1px dashed rgba(255,215,150,0.28); }

  .label {
    position: absolute; left: 100px; top: 86px; width: 570px;
    background: #FFF9E6; border: 4px solid #F39C12; border-radius: 6px;
    padding: 30px 26px 32px; text-align: center; transform: rotate(-1.5deg);
    box-shadow: 6px 8px 22px rgba(0,0,0,0.35);
  }
  .label::before { content: '📎'; position: absolute; top: -28px; left: 50%; transform: translateX(-50%); font-size: 36px; }
  .school { font-size: 16px; letter-spacing: 4px; text-transform: uppercase; color: #7F8C8D; font-weight: 800; }
  .theme { font-family: 'Dancing Script', cursive; font-size: 60px; font-weight: 700; color: #2C5F8A; line-height: 1.05; margin-top: 6px; white-space: nowrap; }
  .forty { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 10px; }
  .forty b { font-size: 92px; font-weight: 800; color: #E74C3C; line-height: 0.9; }
  .forty span { text-align: left; font-size: 26px; font-weight: 800; line-height: 1.2; color: #2C3E50; text-transform: uppercase; letter-spacing: 1px; }
  .forty span small { display: block; font-family: 'Dancing Script', cursive; text-transform: none; letter-spacing: 0; color: #2C5F8A; font-size: 32px; }
  .year { display: inline-block; margin-top: 16px; background: #E74C3C; color: #fff; font-family: 'Dancing Script', cursive; font-size: 28px; font-weight: 700; padding: 6px 28px; border-radius: 30px; transform: rotate(1.5deg); }

  .date {
    position: absolute; left: 100px; bottom: 46px; width: 570px; text-align: center;
    color: #FFF1D6; font-weight: 800; font-size: 24px; letter-spacing: 3px; line-height: 1.5;
    text-shadow: 1px 2px 6px rgba(0,0,0,0.45);
  }

  .pol { position: absolute; background: #fff; padding: 12px 12px 46px; box-shadow: 6px 10px 26px rgba(0,0,0,0.4); }
  .pol img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pol .cap { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-family: 'Dancing Script', cursive; font-weight: 700; font-size: 30px; color: #2C5F8A; }
  .pol::before { content: ''; position: absolute; top: -14px; left: 50%; width: 80px; height: 28px; transform: translateX(-50%) rotate(-3deg); background: rgba(255,235,180,0.75); }
  .p1 { left: 700px; top: 34px; width: 380px; height: 284px; transform: rotate(-5deg); }
  .p1 img { filter: grayscale(1) sepia(0.25) contrast(1.05); }
  .p2 { left: 772px; top: 322px; width: 380px; height: 280px; transform: rotate(4deg); }
  .flower { position: absolute; font-size: 44px; }
</style>
</head>
<body>
  <div class="spine"></div>
  <div class="frame"></div>

  <div class="label">
    <div class="school">THPT Nguyễn Thông · Sổ liên lạc</div>
    <div class="theme">Nguyễn Thông trong tôi</div>
    <div class="forty"><b>40</b><span>Năm ngày hội ngộ<small>1986 – 2026</small></span></div>
    <div class="year">Niên khoá 1983 – 1986</div>
  </div>

  <div class="date">CHỦ NHẬT · 18.10.2026<br><span style="font-size:18px;letter-spacing:3px;opacity:.85">CLB HVN THANH THÚY · LONG AN</span></div>

  <div class="pol p1"><img src="photos/xua-1.webp" alt=""><div class="cap">Ngày ấy · 1986</div></div>
  <div class="pol p2"><img src="photos/nay-1.webp" alt=""><div class="cap">Bây giờ · 2026</div></div>
  <span class="flower" style="left:1110px;top:20px">🌺</span>
  <span class="flower" style="left:700px;top:470px">🌺</span>
</body>
</html>

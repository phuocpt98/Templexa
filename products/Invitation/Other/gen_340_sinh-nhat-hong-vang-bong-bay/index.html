*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:#fff;font-family:'Open Sans',sans-serif;overflow-x:hidden}
.card{width:420px;margin:0 auto;position:relative;overflow-x:clip}
.sec{position:relative;width:420px}
.sec-bg,.sec-ov{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.el{position:absolute}
.t{text-align:center;line-height:1.6;overflow-wrap:break-word}
.t p{margin:0}
.t .op{opacity:var(--op)}
.im i,.ln i{position:absolute;display:block}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.btn-ic{position:absolute;display:block;pointer-events:none}.btn-ic svg{display:block;width:100%;height:100%}
.shape svg{display:block;width:100%;height:100%}
.zoom{cursor:zoom-in}
.collapse-target{display:none}.collapse-target.open{display:block}
.hid{display:none}
.hid-m{display:none}
@media (min-width:768px){.hid-m{display:block}.hid-d{display:none}}
/* trình chiếu ảnh */
.bfly-box{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.bfly{position:absolute;bottom:-40px;animation:bfly-up linear forwards;opacity:0}
.bfly svg{width:100%;height:100%;overflow:visible}
.bfly .w{transform-origin:20px 16px;animation:bfly-flap .35s ease-in-out infinite alternate}
.bfly .w2{animation-delay:.05s}
@keyframes bfly-flap{to{transform:scaleX(.25)}}
@keyframes bfly-up{0%{opacity:0;transform:translate(0,0)}10%{opacity:.95}50%{transform:translate(var(--sway),-55vh) rotate(10deg)}90%{opacity:.9}100%{opacity:0;transform:translate(calc(var(--sway) * -1),-115vh) rotate(-8deg)}}
/* cửa bìa: 2 cánh trượt ra khi mở thiệp */
#door{position:fixed;inset:0;z-index:98}
.door-p{position:absolute;top:0;width:50%;height:100%;overflow:hidden;transition:transform var(--time,2s) ease}
.door-p::before,.door-p::after{content:'';position:absolute;inset:0}
.door-p::before{background:var(--bg);background-size:200% 100%}
.door-p::after{background:var(--img) no-repeat;background-size:cover}
.door-l{left:0}.door-r{right:0}
.door-l::before,.door-r::after{background-position:left center}
.door-l::after,.door-r::before{background-position:right center}
#door.open .door-l{transform:translateX(-100%)}#door.open .door-r{transform:translateX(100%)}
.revealed{transition:transform .9s ease,opacity .9s ease;transform:translateY(-105%);opacity:0;pointer-events:none}
.im .ts-top{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .9s}
.im .ts-top.on{opacity:1}
.gal-v,.gal-c{position:absolute;overflow:hidden}
.gal-s{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .6s}
.gal-s.on{opacity:1}
.gal-a{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:22px;line-height:1;cursor:pointer;z-index:2}
.gal-prev{left:8px}.gal-next{right:8px}
.gal-tr{display:flex;height:100%;overflow-x:auto;scrollbar-width:none}
.gal-tr::-webkit-scrollbar{display:none}
.gal-t{flex:0 0 auto;background-size:cover;background-position:center;opacity:.55;cursor:pointer}
.gal-t.on{opacity:1}
.map iframe{width:100%;height:100%;border:0}
.cd-i{position:absolute;display:flex;align-items:center;justify-content:center}
.cd[style*="flex"] .cd-i,.cd .cd-i{position:absolute}
/* form */
.lp-form .f-item{position:absolute;display:flex;align-items:stretch;overflow:hidden}
.lp-form .f-ctl{width:100%;height:100%;border:0;background:transparent;font:inherit;padding:0 10px;outline:none;color:inherit}
.lp-form select.f-ctl{appearance:none;-webkit-appearance:none;padding-right:24px;background:url("data:image/svg+xml,%3Csvg width='32' height='24' viewBox='0 0 32 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='0,0 32,0 16,24' fill='%23494a4a'/%3E%3C/svg%3E") calc(100% - 8px) 50%/9px 6px no-repeat}
.lp-form textarea.f-ctl{padding:8px 10px;resize:none}
.lp-form .ladi-form-checkbox-box-item,.lp-form .f-item>div{display:flex;align-items:center;gap:14px;padding:0 10px;width:100%}
.lp-form label{display:flex;align-items:center;gap:5px;font-size:12px}
.lp-form .f-btn{position:absolute;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
/* lưu bút */
#sigBoard{position:relative;width:100%;height:100%;user-select:none}
#sigBoard img{position:absolute;width:15%}
#sigBoard .sig-new{cursor:move;outline:1px dashed #888;z-index:3}
.sig-wrap{display:flex;align-items:center;justify-content:center}
#sigCanvas{touch-action:none;cursor:crosshair;max-width:100%}
/* lời chúc */
.wishes{overflow-y:auto;-webkit-overflow-scrolling:touch}
.wishes::-webkit-scrollbar{width:3px}.wishes::-webkit-scrollbar-thumb{background:#888}
#wishList{padding:30px}
.wish{padding:22px 16px 24px;margin-bottom:15px;background:rgba(255,255,255,.92);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid currentColor;border-bottom:1px dashed #545454;white-space:pre-line;color:#748E8A}
.wish b{display:block;margin-bottom:16px;font-size:15px;color:#333}
.wish p{font-size:14px;line-height:1.5;color:#555}
.wish-empty{margin:30px;text-align:center;font-style:italic;border-left:0}
/* popup */
.pop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.pop[hidden]{display:none}
.pop-box{position:relative;background:#fff}
.pop-bg{position:absolute;inset:0;border-radius:inherit}
.pop-full{align-items:flex-start;background:transparent!important}
.pop-full .pop-box{overflow:hidden}
.dropbox{background:transparent!important;align-items:flex-start;justify-content:flex-start}
.dropbox .pop-box{position:fixed}
.snap{overflow:visible}
/* CSS nền tối thiểu cho khối widget còn dùng class LadiPage (album, ảnh, hộp) */
.snap .ladi-image{position:absolute;width:100%;height:100%;overflow:hidden}
.snap .ladi-image-background{position:absolute;width:100%;height:100%;background-repeat:no-repeat;background-size:cover;background-position:center;pointer-events:none}
.snap .ladi-box,.snap .ladi-html-code{position:absolute;width:100%;height:100%}
.snap .photoBookImage{overflow:hidden;cursor:zoom-in}
.snap-m{display:contents}.snap-d{display:none}
@media (min-width:768px){.snap-m{display:none}.snap-d{display:contents}}
.pop-x{position:absolute;right:6px;top:4px;width:30px;height:30px;border:0;background:none;font-size:26px;line-height:1;color:#666;cursor:pointer;z-index:5}
.lightbox{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center}
.lightbox[hidden]{display:none}
.lightbox img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px;transition:opacity .25s}
.lightbox button{position:absolute;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:28px;cursor:pointer}
.lb-x{top:15px;right:20px}.lb-prev{left:15px;top:50%;transform:translateY(-50%)}.lb-next{right:15px;top:50%;transform:translateY(-50%)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:120;background:rgba(40,40,40,.92);color:#fff;font:14px 'Open Sans',sans-serif;padding:10px 16px;border-radius:20px;max-width:90vw;text-align:center}
.todo-ai{outline:2px dashed #e33}
.closing-brand{position:absolute;left:0;right:0;bottom:12px;z-index:5;text-align:center;font:13px 'Open Sans',sans-serif;color:#555;opacity:.75;text-decoration:none}
.closing-brand.on-dark{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}

    };
    if (acts.some(function (a) { return (a.on || 'click') === 'click'; })) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', function (e) { e.stopPropagation(); run('click'); });
    }
    if (acts.some(function (a) { return a.on === 'hover'; })) {
      el.addEventListener('mouseenter', function () { run('hover'); });
      el.addEventListener('mouseleave', function () { run('hover', true); });
    }
  });
  // popup tự mở khi tải trang (phong bì…)
  $$('.pop[data-open]').forEach(function (p) { setTimeout(function () { openPop(p.id); }, +p.getAttribute('data-open') || 0); });

  // ---- Bướm bay (runButterflyEffect của thư viện đại lý)
  function butterflies(o) {
    var box = document.createElement('div'); box.className = 'bfly-box'; document.body.appendChild(box);
    for (var k = 0; k < (o.count || 16); k++) {
      var b = document.createElement('div'); b.className = 'bfly';
      var sz = (18 + Math.random() * 14) * (o.size || 1);
      b.style.cssText = 'left:' + (Math.random() * 100) + 'vw;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + ((o.dur || 12000) / 1000 * (0.6 + Math.random() * 0.5)) + 's;animation-delay:' + (Math.random() * 2) + 's;--sway:' + (Math.random() * 120 - 60) + 'px';
      b.innerHTML = '<svg viewBox="0 0 40 32"><g class="w"><path d="M20 16C14 2 2 2 3 10s9 9 17 6z" fill="' + o.color + '"/><path d="M20 16C12 18 6 26 10 29s9-6 10-13z" fill="' + o.color + '" opacity=".85"/></g><g class="w w2"><path d="M20 16C26 2 38 2 37 10s-9 9-17 6z" fill="' + o.color + '"/><path d="M20 16c8 2 14 10 10 13s-9-6-10-13z" fill="' + o.color + '" opacity=".85"/></g><rect x="19" y="9" width="2" height="15" rx="1" fill="' + o.body + '"/></svg>';
      box.appendChild(b);
    }
    setTimeout(function () { box.remove(); }, (o.dur || 12000) * 1.3 + 2000);
  }

  // ---- Khung ảnh tự chuyển qua ảnh album (class timelineSlide của thư viện đại lý)
  $$('.timelineSlide').forEach(function (el) {
    var i0 = $('i', el); if (!i0) return;
    var list = $$('.zoom i, .snap .photoBookImage .ladi-image-background').map(function (x) { var m = getComputedStyle(x).backgroundImage.match(/url\("?(.*?)"?\)/); return m && m[1]; }).filter(Boolean);
    if (list.length < 2) return;
    var k = 0, top = document.createElement('i'); top.className = 'ts-top'; el.appendChild(top);
    setInterval(function () {
      k = (k + 1) % list.length; top.style.backgroundImage = 'url("' + list[k] + '")'; top.classList.add('on');
      setTimeout(function () { i0.style.backgroundImage = top.style.backgroundImage; top.classList.remove('on'); }, 900);
    }, 3000);
  });

  // ---- Trình chiếu ảnh (ladi-gallery): mũi tên, ảnh nhỏ, tự chuyển, vuốt
  $$('.gal').forEach(function (g) {
    var ss = $$('.gal-s', g), ts = $$('.gal-t', g), i = 0, tr = $('.gal-tr', g);
    var go = function (k) {
      i = (k + ss.length) % ss.length;
      ss.forEach(function (x, j) { x.classList.toggle('on', j === i); });
      ts.forEach(function (x, j) { x.classList.toggle('on', j === i); });
      if (tr && ts[i]) tr.scrollTo({ left: ts[i].offsetLeft - tr.clientWidth / 2 + ts[i].offsetWidth / 2, behavior: 'smooth' });
    };
    $('.gal-prev', g).addEventListener('click', function (e) { e.stopPropagation(); go(i - 1); });
    $('.gal-next', g).addEventListener('click', function (e) { e.stopPropagation(); go(i + 1); });
    ts.forEach(function (t, j) { t.addEventListener('click', function () { go(j); }); });
    var sx = 0, v = $('.gal-v', g);
    v.addEventListener('touchstart', function (e) { sx = e.changedTouches[0].screenX; }, { passive: true });
    v.addEventListener('touchend', function (e) { var dx = e.changedTouches[0].screenX - sx; if (dx < -40) go(i + 1); if (dx > 40) go(i - 1); }, { passive: true });
    var ms = +g.getAttribute('data-auto'); if (ms) setInterval(function () { if (!document.hidden) go(i + 1); }, ms);
  });

  // ---- Album: bấm ảnh phóng to, vuốt/nút chuyển ảnh
  var lb = $('#lightbox');
  if (lb) {
    var lbImg = $('img', lb), pics = [], cur = 0;
    var urlOf = function (el) { var i = $('.ladi-image-background', el) || $('i', el) || el; var m = getComputedStyle(i).backgroundImage.match(/url\("?(.*?)"?\)/); return m ? m[1] : ''; };
    var show = function (i) { cur = (i + pics.length) % pics.length; lbImg.style.opacity = '.3'; lbImg.src = pics[cur]; };
    lbImg.onload = function () { lbImg.style.opacity = '1'; };
    $$('.zoom, .snap .photoBookImage').forEach(function (el) {
      el.addEventListener('click', function () {
        pics = $$('.zoom, .snap .photoBookImage').filter(function (x) { return x.offsetParent; }).map(urlOf).filter(function (u, i, a) { return u && a.indexOf(u) === i; });
        show(Math.max(0, pics.indexOf(urlOf(el)))); lb.hidden = false; document.body.style.overflow = 'hidden';
      });
    });
    var closeLb = function () { lb.hidden = true; document.body.style.overflow = ''; };
    $('.lb-x', lb).addEventListener('click', closeLb);
    $('.lb-prev', lb).addEventListener('click', function () { show(cur - 1); });
    $('.lb-next', lb).addEventListener('click', function () { show(cur + 1); });
    lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', function (e) {
      if (lb.hidden) return;
      if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'ArrowRight') show(cur + 1);
    });
    var sx = 0;
    lb.addEventListener('touchstart', function (e) { sx = e.changedTouches[0].screenX; }, { passive: true });
    lb.addEventListener('touchend', function (e) { var dx = e.changedTouches[0].screenX - sx; if (dx < -50) show(cur + 1); if (dx > 50) show(cur - 1); }, { passive: true });
  }
})();

</script>
</body>

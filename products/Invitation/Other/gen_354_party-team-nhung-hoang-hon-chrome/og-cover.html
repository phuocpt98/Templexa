<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>OG Cover — Party Team Nhung · Hồng Pastel Simba</title>
<!--
  Trang dựng ảnh chia sẻ (og-cover) 1200×630 cho thiệp Party Team Nhung.
  KHÔNG phải trang cho khách xem — chỉ dùng để chụp màn hình sinh ra og-cover.jpg.

  Chụp lại khi đổi nội dung:
    node scripts/build-og-cover.js --page products/Invitation/Other/gen_354_party-team-nhung-hoang-hon-chrome/og-cover.html --out products/Invitation/Other/gen_354_party-team-nhung-hoang-hon-chrome/og-cover.jpg
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .cover {
        position: relative; width: 1200px; height: 630px;
        background: linear-gradient(90deg, #6d2b47 0%, #8e3a5c 34%, #f6d3e2 34.2%, #fdeef3 100%);
        display: flex; align-items: stretch;
        overflow: hidden;
    }
    .frame { position: absolute; inset: 22px; border: 2px solid rgba(232, 180, 160, .8); border-radius: 6px; z-index: 3; }
    .frame::after { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(232, 180, 160, .45); border-radius: 4px; }
    .left {
        position: relative; z-index: 2; flex: 0 0 410px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 40px 20px; text-align: center;
    }
    .medal {
        width: 240px; height: 240px; border-radius: 50% 50% 14px 14px; overflow: hidden;
        border: 3px solid rgba(232, 180, 160, .95);
        outline: 1px solid rgba(232, 180, 160, .45); outline-offset: 8px;
        box-shadow: 0 24px 60px -16px rgba(0,0,0,.65);
        background: #a34a68;
    }
    .medal img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
    .simba {
        font-family: 'Playfair Display', serif; font-weight: 900; font-size: 56px; line-height: 1;
        letter-spacing: .14em; margin-top: 26px;
        background: linear-gradient(180deg, #fff0f3 0%, #f7c6d9 24%, #e79bb8 40%, #b76e8a 50%, #f7c6d9 62%, #ffe3ee 78%, #e8a9c2 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 10px rgba(0,0,0,.35));
    }
    .beerclub {
        font-family: 'Playfair Display', serif; font-weight: 700; font-size: 19px;
        letter-spacing: .52em; text-indent: .52em; color: #f7d9c8; margin-top: 10px;
    }
    .text { position: relative; z-index: 2; flex: 1; padding: 0 64px 0 56px; display: flex; flex-direction: column; justify-content: center; }
    .label {
        font-family: 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 19px;
        letter-spacing: .42em; text-transform: uppercase; color: #b76e8a; margin-bottom: 18px;
    }
    h1 {
        font-family: 'Playfair Display', serif; font-weight: 900; font-size: 88px; line-height: 1.04;
        color: #4a2333;
    }
    .sub {
        font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600; font-size: 24px;
        color: #7a4a5e; margin-top: 20px; line-height: 1.5;
    }
    .date {
        font-family: 'Be Vietnam Pro', sans-serif; font-weight: 800; font-size: 26px;
        letter-spacing: .06em; color: #a34a68; margin-top: 16px;
    }
    .brand {
        position: absolute; right: 52px; bottom: 40px; z-index: 3;
        font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600; font-size: 15px;
        letter-spacing: .3em; text-transform: uppercase; color: rgba(74, 35, 51, .6);
    }
</style>
</head>
<body>
<div class="cover">
  <div class="frame"></div>
  <div class="left">
    <div class="medal"><img src="images/lion-emblem.png" alt="Sư tử đội vương miện"></div>
    <p class="simba">SIMBA</p>
    <p class="beerclub">BEER CLUB</p>
  </div>
  <div class="text">
    <p class="label">Party · Giao lưu · Gắn kết tập thể</p>
    <h1>PARTY<br>TEAM NHUNG</h1>
    <p class="sub">Một buổi chiều gặp nhau ngoài giờ làm —<br>cùng chơi, cùng cười, hiểu nhau hơn.</p>
    <p class="date">15:00 · Thứ Tư 18.11.2026 · S Villa, Đà Nẵng</p>
  </div>
  <div class="brand">templexa.vn</div>
</div>
</body>
</html>

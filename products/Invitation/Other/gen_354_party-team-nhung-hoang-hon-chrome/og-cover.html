<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>OG Cover — Party Team Nhung</title>
<!--
  Trang dựng ảnh chia sẻ (og-cover) 1200×630 cho thiệp Party Team Nhung.
  KHÔNG phải trang cho khách xem — chỉ dùng để chụp màn hình sinh ra og-cover.jpg.

  Chụp lại khi đổi nội dung:
    node scripts/build-og-cover.js --page products/Invitation/Other/gen_354_party-team-nhung-hoang-hon-chrome/og-cover.html --out products/Invitation/Other/gen_354_party-team-nhung-hoang-hon-chrome/og-cover.jpg
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .cover {
        position: relative; width: 1200px; height: 630px;
        background: linear-gradient(115deg, #052730 0%, #0b4450 34%, #7a4a26 62%, #c96f2e 82%, #e07f35 100%);
        display: flex; align-items: center;
        overflow: hidden;
    }
    .cover::after {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(ellipse 55% 80% at 78% 50%, rgba(245,200,107,.22), transparent 70%);
    }
    .frame { position: absolute; inset: 22px; border: 2px solid rgba(245,200,107,.55); border-radius: 6px; z-index: 3; }
    .frame::after { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(245,200,107,.3); border-radius: 4px; }
    .medal {
        position: relative; z-index: 2; flex: 0 0 300px; margin-left: 110px;
        width: 300px; height: 300px; border-radius: 50% 50% 14px 14px; overflow: hidden;
        border: 3px solid rgba(245,200,107,.9);
        outline: 1px solid rgba(245,200,107,.4); outline-offset: 8px;
        box-shadow: 0 24px 60px -16px rgba(0,0,0,.65);
        background: #0b4450;
    }
    .medal img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
    .text { position: relative; z-index: 2; flex: 1; padding: 0 70px 0 64px; color: #fff8ee; }
    .label {
        font-family: 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 19px;
        letter-spacing: .42em; text-transform: uppercase; color: #ffe9a8; margin-bottom: 18px;
    }
    h1 {
        font-family: 'Playfair Display', serif; font-weight: 900; font-size: 92px; line-height: 1.02;
        background: linear-gradient(180deg, #fffbe0 0%, #ffe98a 24%, #f5b942 40%, #a86f14 50%, #ffe98a 62%, #fff3b0 78%, #e8a93c 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 12px rgba(0,0,0,.35));
    }
    .sub {
        font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600; font-size: 24px;
        color: rgba(255,248,238,.95); margin-top: 20px; line-height: 1.5;
    }
    .date {
        font-family: 'Be Vietnam Pro', sans-serif; font-weight: 800; font-size: 26px;
        letter-spacing: .06em; color: #ffe9a8; margin-top: 14px;
    }
    .brand {
        position: absolute; right: 52px; bottom: 40px; z-index: 3;
        font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600; font-size: 15px;
        letter-spacing: .3em; text-transform: uppercase; color: rgba(255,248,238,.75);
    }
</style>
</head>
<body>
<div class="cover">
  <div class="frame"></div>
  <div class="medal"><img src="images/lion-emblem.png" alt="Sư tử đội vương miện"></div>
  <div class="text">
    <p class="label">Party · Giao lưu · Gắn kết tập thể</p>
    <h1>PARTY<br>TEAM NHUNG</h1>
    <p class="sub">Một buổi chiều gặp nhau ngoài giờ làm —<br>cùng chơi, cùng cười, hiểu nhau hơn.</p>
    <p class="date">15:00 · Thứ Tư 18.11.2026 · S Villa, Đà Nẵng</p>
  </div>
  <div class="brand">templexa.vn</div>
</div>
</body>
</html>

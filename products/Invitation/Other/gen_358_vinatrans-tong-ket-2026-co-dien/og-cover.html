<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>OG Cover — Vinatrans Tổng kết 2026 · Cổ điển</title>
<!-- Trang dựng ảnh chia sẻ (og-cover) 1200×630. KHÔNG phải trang cho khách xem — chỉ dùng để chụp ra og-cover.jpg.
  Chụp lại khi đổi nội dung:
    node scripts/build-og-cover.js --page products/Invitation/Other/gen_358_vinatrans-tong-ket-2026-co-dien/og-cover.html --out products/Invitation/Other/gen_358_vinatrans-tong-ket-2026-co-dien/og-cover.jpg -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .cover { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(1200px 500px at 50% -10%, #2a4bb0 0%, #122a7a 45%, #0a1e5e 100%);
    color: #fff; text-align: center; font-family: 'Be Vietnam Pro', sans-serif; }
  .cover::before { content: ''; position: absolute; inset: 0;
    background: repeating-conic-gradient(from 0deg at 50% -20%, rgba(255,255,255,.05) 0deg 6deg, transparent 6deg 12deg); }
  .frame { position: absolute; inset: 24px; border: 2px solid rgba(212,175,55,.85); border-radius: 8px; z-index: 3; }
  .frame::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(212,175,55,.45); border-radius: 5px; }
  .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 90px; }
  .logo { height: 74px; filter: brightness(0) invert(1); }
  .co { font-size: 21px; font-weight: 600; letter-spacing: .14em; margin-top: 26px; color: #dfe7ff; }
  h1 { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 92px; line-height: 1.05; letter-spacing: .06em; margin-top: 10px; }
  .sub { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 34px; color: #f2d98c; margin-top: 6px; }
  .rule { display: flex; align-items: center; gap: 14px; margin: 22px 0 18px; color: #d4af37; }
  .rule::before, .rule::after { content: ''; width: 180px; height: 2px; background: #d4af37; }
  .rule span { font-size: 20px; }
  .when { font-size: 27px; font-weight: 700; letter-spacing: .04em; }
  .where { font-size: 22px; color: #c9d6ff; margin-top: 8px; }
</style>
</head>
<body>
<div class="cover">
  <div class="frame"></div>
  <div class="inner">
    <img class="logo" src="images/logo.png" alt="VINATRANS">
    <p class="co">CÔNG TY CỔ PHẦN GIAO NHẬN KHO VẬN NGOẠI THƯƠNG VIỆT NAM</p>
    <h1>HỘI NGHỊ</h1>
    <p class="sub">Tổng kết công tác năm 2026</p>
    <div class="rule"><span>◆</span></div>
    <p class="when">Thứ Sáu · 25.12.2026 · 09:00</p>
    <p class="where">Hội trường Lầu 6, 56 Thủ Khoa Huân, P. Bến Thành, TP.HCM</p>
  </div>
</div>
</body>
</html>

<style>
  :root{--olive:#4A5D3A;--cream:#FAF3E3;--gold:#C9A227;--terra:#D28F5B;--ink:#2B211B;--ink-soft:#8A6D4B}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:var(--cream);font-family:'Cormorant Garamond',serif;color:var(--ink)}
  .frame{position:absolute;inset:14px;border:1px solid rgba(201,162,39,.55);pointer-events:none;z-index:5}
  .photo{position:absolute;left:0;top:0;width:600px;height:630px;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
  .photo::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 80%,rgba(250,243,227,.5) 95%,var(--cream) 100%)}
  .panel{position:absolute;left:620px;top:0;width:580px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;z-index:2}
  .eyebrow{font-size:19px;letter-spacing:.42em;text-transform:uppercase;color:var(--terra);padding-left:.42em;font-weight:600}
  .names{font-family:'Great Vibes',cursive;font-size:92px;line-height:1.12;color:var(--olive);margin-top:18px}
  .names .amp{display:block;font-size:46px;line-height:.9;color:var(--terra);margin:4px 0}
  .rule{display:flex;align-items:center;gap:12px;width:280px;margin:28px auto 0}
  .rule i{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--terra))}
  .rule i:last-child{background:linear-gradient(90deg,var(--terra),transparent)}
  .rule b{width:9px;height:9px;transform:rotate(45deg);background:var(--gold)}
  .date{font-size:46px;letter-spacing:.14em;color:var(--ink);margin-top:24px;font-weight:600}
  .sub{font-size:23px;font-weight:500;line-height:1.5;color:var(--ink);margin-top:16px}
  .sub b{font-weight:600;color:var(--olive)}
</style>

<body>
  <div class="frame"></div>
  <div class="photo"><img src="customer/anh-3-chinh-dien.png" alt="Ảnh cưới Việt Anh &amp; Thảo Vy"></div>
  <div class="panel">
    <div class="eyebrow">Thiệp cưới</div>
    <div class="names">Việt Anh<span class="amp">&amp;</span>Thảo Vy</div>
    <div class="rule"><i></i><b></b><i></i></div>
    <div class="date">03 · 01 · 2027</div>
    <p class="sub"><b>Tiệc mừng</b> · 11:30 ngày 03.01.2027<br>Nhà hàng Cường Vy — Bảo Lộc, Lâm Đồng</p>
  </div>

<style>
  :root{--paper:#FAF7F5;--blush:#F2DADB;--blush-light:#F8ECEA;--rose:#C48B8F;--rose-deep:#9E6B6E;--ink:#7D4C4D;--ink-soft:#A67172;--rosegold:#C9A08A}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:linear-gradient(105deg,var(--blush-light) 0%,var(--paper) 55%,var(--blush) 130%);font-family:'Be Vietnam Pro',sans-serif;color:var(--ink)}
  body::before{content:'';position:absolute;inset:0;background:url('../../../shared/images/wedding/backgrounds/paper-emboss/bg-paper-emboss-cream-light.webp') center/900px repeat;opacity:.22;mix-blend-mode:multiply}
  /* anh trai */
  .photo{position:absolute;left:0;top:0;width:652px;height:630px;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 16%;display:block}
  .photo::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 78%,rgba(250,247,245,.55) 96%,var(--paper) 100%)}
  /* hoa de len goc noi */
  .seam-flowers{position:absolute;left:520px;bottom:-28px;width:230px;z-index:3;transform:rotate(8deg)}
  .corner-flowers{position:absolute;right:-36px;top:-30px;width:250px;z-index:3;transform:scaleX(-1) rotate(10deg);opacity:.95}
  .pearls{position:absolute;right:26px;bottom:118px;width:110px;z-index:3;opacity:.9}
  .seal{width:64px;margin:0 auto 14px;display:block;filter:drop-shadow(0 4px 8px rgba(125,76,77,.3))}
  /* khoi chu phai */
  .panel{position:absolute;left:678px;top:0;width:478px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 10px;z-index:2}
  .eyebrow{font-family:'Tinos',serif;letter-spacing:.38em;text-transform:uppercase;font-size:17px;color:var(--ink-soft);padding-left:.38em}
  .names{font-family:'Dancing Script',cursive;font-weight:700;font-size:88px;line-height:1.08;color:var(--rose-deep);margin-top:16px}
  .names .amp{display:block;font-size:44px;line-height:.9;color:var(--rose);margin:2px 0}
  .rule{display:flex;align-items:center;gap:12px;width:270px;margin:26px auto 0}
  .rule i{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--rose))}
  .rule i:last-child{background:linear-gradient(90deg,var(--rose),transparent)}
  .rule b{width:9px;height:9px;transform:rotate(45deg);background:var(--rosegold)}
  .date{font-family:'Tinos',serif;font-size:43px;letter-spacing:.14em;color:var(--ink);margin-top:22px}
  .sub{font-size:20px;font-weight:300;line-height:1.55;color:var(--ink);margin-top:14px}
  .sub b{font-weight:500;color:var(--rose-deep)}
</style>
</head>
<body>
  <div class="photo"><img src="photos/anh_1.webp" alt=""></div>
  <img class="seam-flowers" src="assets/flowers-cluster.webp" alt="">
  <img class="corner-flowers" src="assets/flowers-cluster.webp" alt="">
  <img class="pearls" src="assets/pearls.webp" alt="">

  <div class="panel">
    <img class="seal" src="assets/wax-seal.webp" alt="">
    <div class="eyebrow">Thiệp cưới</div>
    <div class="names">Văn Thức<span class="amp">&amp;</span>Thuý Hằng</div>
    <div class="rule"><i></i><b></b><i></i></div>
    <div class="date">02 · 11 · 2026</div>
    <p class="sub"><b>Bữa cơm thân mật</b> · 01.11.2026<br>Kiêu Kỵ · Gia Lâm · Hà Nội</p>
  </div>
</body>

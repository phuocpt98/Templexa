<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>og-cover — Vạn Trí &amp; Ngọc Linh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Ergisa";
    src: url("../../../shared/fonts/ergisa.otf") format("opentype");
    font-weight: 400; font-style: normal; font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }

  .cover {
    position: relative; width: 1200px; height: 630px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: hsl(40, 33%, 95%);
    overflow: hidden;
  }
  /* nền: khung cổng hoa, làm nhạt để chữ nổi */
  .cover::before {
    content: ""; position: absolute; inset: 0;
    background: url("./assets/og-bg.jpg") center 38% / cover no-repeat;
    opacity: .38;
  }
  .cover::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 78% at 50% 50%,
                hsla(40,33%,96%,.94) 34%, hsla(40,33%,95%,.72) 72%, hsla(40,30%,93%,.55) 100%);
  }
  .inner { position: relative; z-index: 2; text-align: center; padding: 0 70px; }

  .seal { width: 92px; height: auto; display: block; margin: 0 auto 22px;
          filter: drop-shadow(0 6px 12px rgba(60,74,58,.24)); }

  .names {
    font-family: "Ergisa", Georgia, serif;
    font-size: 96px; line-height: 1.1; color: hsl(137, 19%, 28%);
    letter-spacing: .01em; white-space: nowrap;
  }
  .names .amp { font-size: .62em; opacity: .6; padding: 0 .16em; }

  .invite {
    font-family: "Lora", Georgia, serif; font-weight: 600;
    font-size: 18px; letter-spacing: .22em; text-transform: uppercase;
    color: hsl(137, 14%, 42%); margin-top: 20px;
  }

  .rule { width: 54px; height: 1px; background: hsla(137,19%,28%,.28); margin: 26px auto; }

  .date {
    display: flex; align-items: center; justify-content: center; gap: 26px;
    font-family: "Lora", Georgia, serif; color: hsl(137, 19%, 30%);
  }
  .date .side { font-size: 21px; letter-spacing: .26em; text-transform: uppercase; opacity: .78; }
  .date .num  { font-family: "Ergisa", Georgia, serif; font-size: 62px; line-height: 1; }

  .place {
    font-family: "Lora", Georgia, serif; font-style: italic;
    font-size: 19px; color: hsl(137, 12%, 46%); margin-top: 22px;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="inner">
      <img class="seal" src="./assets/wax-seal.png" alt="">
      <div class="names">Vạn&nbsp;Trí <span class="amp">&amp;</span> Ngọc&nbsp;Linh</div>
      <div class="invite">Trân trọng kính mời quý khách đến dự Lễ Đính Hôn</div>
      <div class="rule"></div>
      <div class="date">
        <span class="side">Tháng 9</span>
        <span class="num">20</span>
        <span class="side">2026</span>
      </div>
      <div class="place">Tư gia nhà gái · Buôn Ma Thuột, Đắk Lắk</div>
    </div>
  </div>
</body>
</html>

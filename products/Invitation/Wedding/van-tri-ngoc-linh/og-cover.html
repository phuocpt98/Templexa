<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>OG Cover — Vạn Trí &amp; Ngọc Linh</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--g:#3A5542;--cream:#F7F4EC}
  html,body{width:1200px;height:630px;overflow:hidden}
  .wrap{position:relative;width:1200px;height:630px;background:var(--cream)}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
  /* phủ kem để chữ nổi, đậm hơn ở giữa */
  .veil{position:absolute;inset:0;
    background:
      radial-gradient(ellipse 62% 78% at 50% 52%,rgba(247,244,236,.9),rgba(247,244,236,.35) 62%,rgba(247,244,236,.1) 100%),
      linear-gradient(rgba(247,244,236,.28),rgba(247,244,236,.12) 45%,rgba(247,244,236,.38))}
  .in{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:var(--g);
    font-family:'EB Garamond',Georgia,serif}
  .seal{width:96px;margin-bottom:14px;filter:drop-shadow(0 6px 14px rgba(58,85,66,.28))}
  .names{font-family:'Pinyon Script',cursive;font-size:82px;line-height:1.02;
    text-shadow:0 2px 16px rgba(247,244,236,.95);white-space:nowrap}
  .req{margin-top:14px;font-size:19px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;
    text-shadow:0 1px 8px rgba(247,244,236,.95)}
  .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px;
    width:430px;margin-top:26px}
  .side{font-size:22px;letter-spacing:.16em;text-transform:uppercase;padding:7px 0;
    border-top:1px solid rgba(58,85,66,.55);border-bottom:1px solid rgba(58,85,66,.55)}
  .big{font-size:74px;line-height:1;font-weight:500;
    font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
  .place{margin-top:20px;font-size:20px;font-style:italic;color:rgba(58,85,66,.8)}
</style>
</head>
<body>
  <div class="wrap">
    <img class="bg" src="assets/og-bg.webp" alt="">
    <div class="veil"></div>
    <div class="in">
      <img class="seal" src="assets/seal-monogram-sage.webp" alt="">
      <div class="names">Vạn Trí &amp; Ngọc Linh</div>
      <div class="req">Trân trọng kính mời quý khách đến dự lễ đính hôn</div>
      <div class="row">
        <span class="side">Tháng 9</span>
        <span class="big">20</span>
        <span class="side">2026</span>
      </div>
      <div class="place">Tư gia nhà gái · Buôn Ma Thuột, Đắk Lắk</div>
    </div>
  </div>
</body>
</html>

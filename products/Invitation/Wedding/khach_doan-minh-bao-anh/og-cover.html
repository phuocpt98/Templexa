<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>OG Cover — Thiệp cưới Đoàn Minh & Bảo Anh</title>
<!--
  Trang dựng ảnh chia sẻ 1200×630 (customer/og-cover.jpg) — không phải trang cho khách xem.
  Chụp lại khi đổi nội dung:
    node scripts/build-og-cover.js --page products/Invitation/Wedding/khach_doan-minh-bao-anh/og-cover.html --out products/Invitation/Wedding/khach_doan-minh-bao-anh/customer/og-cover.jpg
  Ảnh trái là ảnh cưới thật của khách (customer/og-photo.jpg) — thay bằng ảnh khác thì sửa src dưới đây rồi chụp lại.
-->
<style>
@font-face{font-family:'Lora';font-style:normal;font-weight:400;font-display:swap;src:url('../../../shared/fonts/font-lora.ttf') format('truetype');}
@font-face{font-family:'Lora';font-style:normal;font-weight:600;font-display:swap;src:url('../../../shared/fonts/font-lora-semibold.ttf') format('truetype');}
</style>
<style>
  :root{--sage:#525F3E;--olive:#92845F;--paper:#FBF8F1;--ink:#3E4A2E;--gold:#A98F5F}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:var(--paper);font-family:'Lora',serif;color:var(--ink)}
  body::before{content:'';position:absolute;inset:0;background:url('../../../shared/images/wedding-elements/thiep-thanh-dat-element_0033_1.webp') center/cover no-repeat;opacity:.35}
  .photo{position:absolute;left:0;top:0;width:600px;height:630px;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
  .photo::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 72%,rgba(251,248,241,.6) 92%,var(--paper) 100%)}
  .frame{position:absolute;left:24px;top:24px;width:552px;height:582px;border:1px solid rgba(255,255,255,.75);z-index:2;pointer-events:none}
  .panel{position:absolute;left:640px;top:0;width:520px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 10px;z-index:2}
  .eyebrow{letter-spacing:.42em;text-transform:uppercase;font-size:17px;color:var(--olive);padding-left:.42em}
  .names{font-weight:600;font-size:76px;line-height:1.12;color:var(--sage);margin-top:18px;text-transform:uppercase;letter-spacing:2px}
  .names .amp{display:block;font-size:40px;line-height:1;color:var(--gold);margin:6px 0}
  .rule{display:flex;align-items:center;gap:12px;width:260px;margin:26px auto 0}
  .rule i{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
  .rule i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
  .rule b{width:9px;height:9px;transform:rotate(45deg);background:var(--gold)}
  .date{font-size:40px;letter-spacing:.16em;color:var(--ink);margin-top:22px}
  .sub{font-size:19px;line-height:1.6;color:var(--ink);margin-top:14px}
  .sub b{font-weight:600;color:var(--sage)}
</style>
</head>
<body>
  <div class="photo"><img src="customer/og-photo.jpg" alt="Ảnh cưới Đoàn Minh & Bảo Anh"></div>
  <div class="frame"></div>

  <div class="panel">
    <div class="eyebrow">Thiệp cưới</div>
    <div class="names">Đoàn Minh<span class="amp">&amp;</span>Bảo Anh</div>
    <div class="rule"><i></i><b></b><i></i></div>
    <div class="date">27 · 12 · 2026</div>
    <p class="sub"><b>Tiệc cưới</b> · 16:30 Chủ nhật, 27.12.2026<br>Sảnh SAPPHIRE · Tầng 3 · The Pride, Lạng Sơn</p>
  </div>
</body>
</html>

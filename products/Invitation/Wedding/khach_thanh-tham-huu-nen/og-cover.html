<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Playfair Display', serif; }
  .wrap { display: flex; width: 1200px; height: 630px; background: #45523D; }
  .photo { width: 560px; height: 630px; background: url('assets/images/hn-full-img_5983.webp') center 18% / cover no-repeat; }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; position: relative; }
  .panel::before { content: ""; position: absolute; inset: 18px; border: 1px solid rgba(234,201,142,.65); pointer-events: none; }
  .panel::after { content: ""; position: absolute; inset: 26px; border: 1px solid rgba(234,201,142,.3); pointer-events: none; }
  .save { font-family: 'Imperial Script', cursive; font-size: 64px; color: #EAC98E; line-height: 1; }
  .names { font-size: 56px; font-weight: 600; color: #F4ECDC; line-height: 1.15; margin-top: 14px; }
  .names span { color: #EAC98E; }
  .rule { width: 120px; height: 1px; background: #C9A15E; margin: 22px 0; }
  .date { font-size: 30px; letter-spacing: 6px; color: #F4ECDC; }
  .sub { font-size: 19px; color: #D8CFB8; margin-top: 12px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="photo"></div>
  <div class="panel">
    <div class="save">Save the Date</div>
    <div class="names">Thanh Thắm <span>&amp;</span><br>Hữu Nên</div>
    <div class="rule"></div>
    <div class="date">04 · 12 · 2026</div>
    <div class="sub">Lễ Vu Quy 04/12 &nbsp;·&nbsp; Lễ Tân Hôn 06/12</div>
  </div>
</div>
</body>
</html>

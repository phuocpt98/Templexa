        html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; background: #f7f2ea; }
        iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .fallback {
            display: flex; align-items: center; justify-content: center;
            height: 100%; padding: 40px; text-align: center;
            font-family: system-ui, sans-serif; color: #7a1f2b; line-height: 1.7;
        }
    </style>

<body>
    <iframe id="f" allowfullscreen allow="autoplay"></iframe>
    <script src="../config.js?v=20261013"></script>
    <script>
        (function () {
            var parts = location.pathname.replace(/\/index\.html$/i, '').split('/').filter(Boolean);
            var slug = parts[parts.length - 1];
            var entry = (typeof EVENT !== 'undefined') && EVENT[slug];

            if (!entry) return showError();

            var base = location.pathname.replace(/\/event\/[^/]+\/.*$/, '/');
            var params = new URLSearchParams(location.search);
            var src;

            if (entry.variants) {
                // Nhiều biến thể — ?id= chọn bản thiết kế + nội dung
                var id = params.get('id') || entry.defaultId;
                var variant = entry.variants[id];
                if (!variant) return showError('Không tìm thấy mẫu thiệp với mã "' + id + '".');

                // Giữ lại các query khác của khách, bỏ `id` vì nó chỉ dùng ở lớp này
                params.delete('id');
                var extra = params.toString();
                var query = [variant.query, extra].filter(Boolean).join('&');

                src = base
                    + entry.base.replace(/^\.\.\/\.\.\//, '')
                    + variant.dir + '/index.html'
                    + (query ? '?' + query : '');
            } else {
                src = base + entry.src.replace(/^\.\.\/\.\.\//, '') + location.search;
            }

            document.getElementById('f').src = src + location.hash;

            function showError(msg) {
                document.body.innerHTML = '<div class="fallback"><p>'
                    + (msg || 'Không tìm thấy thiệp. Vui lòng kiểm tra lại đường dẫn.')
                    + '</p></div>';
            }
        })();
    </script>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh thiếp số</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Danh thiếp số">
    <meta property="og:description" content="Ai đó chia sẻ danh thiếp số với bạn. Mở link để xem!">
    <meta property="og:site_name" content="Templexa">
    <meta property="og:locale" content="vi_VN">

    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <iframe id="f" allowfullscreen></iframe>
    <script src="../config.js"></script>
    <script>
        (function () {
            var parts = location.pathname.replace(/\/index\.html$/i, '').split('/').filter(Boolean);
            var slug = parts[parts.length - 1];
            var entry = (typeof DIGITAL_CARD !== 'undefined') && DIGITAL_CARD[slug];
            if (entry) {
                var base = location.pathname.replace(/\/card\/[^/]+\/.*$/, '/');
                var src = base + 'digital-card.html?t=' + entry.tpl;
                var qs = location.search.replace(/^\?/, '');
                if (qs) src += '&' + qs;
                document.getElementById('f').src = src;
            } else {
                document.body.innerHTML = '<p style="text-align:center;padding:40px;font-family:sans-serif;color:#666">Không tìm thấy mẫu. Vui lòng kiểm tra lại đường dẫn.</p>';
            }
        })();
    </script>
</body>
</html>

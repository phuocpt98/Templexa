<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>og — xem ngày cưới</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .c { position: relative; width: 1200px; height: 630px; background: #FAF7F2;
       display: flex; align-items: center; justify-content: space-between;
       padding: 0 72px; overflow: hidden; }
  .c::after { content: ''; position: absolute; inset: 26px; border: 1px solid #E7DED0;
              border-radius: 18px; pointer-events: none; }
  .goc { position: absolute; width: 300px; height: auto; }
  .goc.tl { top: -30px; left: -30px; }
  .goc.br { bottom: -30px; right: -30px; transform: rotate(180deg); }
  .txt { position: relative; z-index: 2; max-width: 620px; }
  .cap { font-family: Inter, sans-serif; font-size: 15px; font-weight: 700;
         letter-spacing: .3em; text-transform: uppercase; color: #B99456; margin-bottom: 20px; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600;
       font-size: 68px; line-height: 1.14; color: #3D3833; margin-bottom: 22px; }
  h1 em { font-style: italic; color: #7C8B6F; }
  p { font-family: Inter, sans-serif; font-size: 21px; line-height: 1.6; color: #6B625A; }
  .tag { display: flex; gap: 10px; margin-top: 28px; }
  .tag span { font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; color: #5F6E55;
              background: #EDF0E8; border: 1px solid #DDE3D5; border-radius: 999px; padding: 9px 20px; }
  .art { position: relative; z-index: 2; width: 380px; }
  .art img { width: 100%; height: auto; }
  .brand { position: absolute; left: 72px; bottom: 52px; z-index: 2;
           font-family: Inter, sans-serif; font-size: 17px; font-weight: 700;
           letter-spacing: .16em; text-transform: uppercase; color: #9A9088; }
</style>
</head>
<body>
  <div class="c">
    <img class="goc tl" src="./goc-hoa.webp" alt="">
    <img class="goc br" src="./goc-hoa.webp" alt="">
    <div class="txt">
      <div class="cap">Công cụ miễn phí</div>
      <h1>Xem <em>ngày cưới đẹp</em><br>cho hai bạn</h1>
      <p>Tra kim lâu, hoang ốc, tam tai theo tuổi<br>và lọc ngày hoàng đạo hợp cưới hỏi.</p>
      <div class="tag"><span>Kim lâu</span><span>Hoang ốc</span><span>Tam tai</span></div>
    </div>
    <div class="art"><img src="./hero-lich-am.webp" alt=""></div>
    <div class="brand">templexa.vn</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vũ Trường & Quỳnh Mai — Thiệp Cưới</title>

    <!-- OG Meta — Facebook, Zalo, Messenger preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Vũ Trường & Quỳnh Mai — Thiệp Cưới">
    <meta property="og:description" content="Trân trọng kính mời dự tiệc cưới — 18:00 thứ Bảy 19/12/2026 tại Sảnh Sapphire, Tầng 2 Khách sạn Lotte Sài Gòn, TP. Hồ Chí Minh">
    <meta property="og:image" content="https://templexa.vn/products/Invitation/Wedding/khach_vu-truong-quynh-mai/og-cover.jpg">
    <meta property="og:url" content="https://templexa.vn/wedding/vu-truong-quynh-mai/">
    <meta property="og:site_name" content="Templexa Wedding">
    <meta property="og:locale" content="vi_VN">

    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <iframe id="f" allowfullscreen allow="autoplay"></iframe>
    <script src="../config.js"></script>
    <script>
        (function () {
            var parts = location.pathname.replace(/\/index\.html$/i, '').split('/').filter(Boolean);
            var slug = parts[parts.length - 1];
            var entry = (typeof WEDDING !== 'undefined') && WEDDING[slug];
            if (entry) {
                // Tính base URL: từ /wedding/{slug}/ lùi 2 cấp về gốc project
                var base = location.pathname.replace(/\/wedding\/[^/]+\/.*$/, '/');
                var fullSrc = base + entry.src.replace(/^\.\.\/\.\.\//,'');
                document.getElementById('f').src = fullSrc + location.search + location.hash;
            } else {
                document.body.innerHTML = '<p style="text-align:center;padding:40px;font-family:sans-serif;color:#666">Không tìm thấy thiệp. Vui lòng kiểm tra lại đường dẫn.</p>';
            }
        })();
    </script>
</body>
</html>

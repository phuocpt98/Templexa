<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiệp mời tạm thời không khả dụng</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #faf7f2;
    color: #5a4a3a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 { font-size: 22px; font-weight: normal; letter-spacing: 0.5px; margin-bottom: 14px; }
  p { font-size: 15px; line-height: 1.7; color: #8a7a68; max-width: 340px; }
  .mark { font-size: 34px; margin-bottom: 18px; color: #b8a88f; }
  .brand { margin-top: 28px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #b8a88f; }
</style>
</head>
<body>
  <div class="mark">&#9993;</div>
  <h1>Thiệp mời tạm thời không khả dụng</h1>
  <p>Thiệp mời này hiện đang tạm khoá.<br>Vui lòng quay lại sau.</p>
  <div class="brand">Templexa</div>
</body>
</html>
